services:
  bayesian-server:
    build: .
    container_name: bayesian-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./scripts:/app/scripts:ro
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Rome
      - VALIDATION_SCHEDULE=0 6 * * *
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
      - EMAIL_RECIPIENT=${EMAIL_RECIPIENT}
      - WEATHER_LATITUDE=${WEATHER_LATITUDE}
      - WEATHER_LONGITUDE=${WEATHER_LONGITUDE}
    networks:
      - sprinkler-net

  web-frontend:
    build: ./web_frontend
    container_name: smartsprinkler-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - sprinkler-net

networks:
  sprinkler-net:
    driver: bridge

