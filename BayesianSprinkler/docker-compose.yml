services:
  bayesian-server:
    build: .
    container_name: bayesian-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    network_mode: host

