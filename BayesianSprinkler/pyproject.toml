[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bayesian-sprinkler"
version = "0.2.0"
description = "Bayesian network controller for autonomous smart sprinkler irrigation"
requires-python = ">=3.10"
dependencies = [
    "pgmpy>=0.1.23",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "apscheduler>=3.10.0",
    "pandas>=2.0.0",
]

[project.scripts]
bayesian-sprinkler = "bayesian_sprinkler.main:main"

[tool.setuptools.packages.find]
where = ["src"]
