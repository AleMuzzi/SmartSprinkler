; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = app4MB_ota.csv
board_upload.flash_size = 4MB
build_flags =
	-DMG_ENABLE_HTTP_STREAMING_MULTIPART=1
	-DMG_COPY_HTTP_MESSAGE=0
extra_script = extra_script.py
build_src_filter =
	+<esp32>
	+<model>
	+<utils>
	+<sensors>
	+<services>
lib_deps =
	olikraus/U8g2@^2.36.12
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.15
	bblanchon/ArduinoJson @ ^7.4.2
	jeremypoulter/ArduinoMongoose @ ^0.0.22
	braydenanderson2014/SimpleVector @ ^1.0.9

; Default build: breadboard / prototype wiring (Active HIGH relay, SG90 rotary selector).
[env:esp32]
extends = common
build_src_filter =
	${common.build_src_filter}
	-<esp32/plant_sprinkler_valve.cpp>
lib_deps =
	${common.lib_deps}
	madhephaestus/ESP32Servo@^3.2.0

; PCB build: Active LOW relay + 3 binary valves driven by the Nano (no servo).
[env:esp32_pcb]
extends = common
build_flags =
	${common.build_flags}
	-DWITH_PCB
build_src_filter =
	${common.build_src_filter}
	-<esp32/plant_sprinkler_rotary.cpp>

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = arduino_nano
build_src_filter =
	+<arduino_nano>
	+<sensors/*>
monitor_speed = 9600
lib_deps =
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.5

; PCB build: Nano drives D6/D7/D8 (active LOW) for the 3 solenoid valves.
[env:nano_pcb]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = arduino_nano
build_src_filter =
	+<arduino_nano>
	+<sensors/*>
monitor_speed = 9600
build_flags =
	-DWITH_PCB
lib_deps =
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.5
