; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
board_build.partitions = app4MB_ota.csv
board_upload.flash_size = 4MB
build_flags =
	-DMG_ENABLE_HTTP_STREAMING_MULTIPART=1
	-DMG_COPY_HTTP_MESSAGE=0
extra_script = extra_script.py
build_src_filter =
	+<esp32>
	+<model>
	+<utils>
	+<sensors>
	+<services>
lib_deps =
	olikraus/U8g2@^2.36.12
	adafruit/DHT sensor library @ ^1.4.6
	adafruit/Adafruit Unified Sensor @ ^1.1.15
	bblanchon/ArduinoJson @ ^7.4.2
	jeremypoulter/ArduinoMongoose @ ^0.0.22
	braydenanderson2014/SimpleVector @ ^1.0.9
	madhephaestus/ESP32Servo @ ^3.2.0
;
;[env:esp32_no_cam]
;platform = espressif32
;board = esp32cam
;framework = arduino
;monitor_speed = 115200
;monitor_rts = 0
;monitor_dtr = 0
;board_build.partitions = huge_app.csv
;build_src_filter =
;	+<main.cpp>
;	+<model>
;	+<utils>
;	+<sensors>
;	+<services>
;lib_deps =
;	adafruit/DHT sensor library @ ^1.4.6
;	adafruit/Adafruit Unified Sensor @ ^1.1.15
;	bblanchon/ArduinoJson @ ^7.4.2
;	jeremypoulter/ArduinoMongoose @ ^0.0.22
;	braydenanderson2014/SimpleVector @ ^1.0.9
;	olikraus/U8g2@^2.36.12
;	madhephaestus/ESP32Servo @ ^3.2.0

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino
src_dir = arduino_nano
build_src_filter =
	+<arduino_nano>
	+<sensors/*>
monitor_speed = 9600
lib_deps =
	adafruit/DHT sensor library@^1.4.6
	adafruit/Adafruit Unified Sensor@^1.1.15
